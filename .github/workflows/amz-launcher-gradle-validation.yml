name: AMZ Isolated Launcher Gradle Build

on:
  push:
    branches:
      - amz-launcher-integration
    paths:
      - ".github/workflows/amz-launcher-gradle-validation.yml"
      - "AMZ_LAUNCHER_PORT/**"
  workflow_dispatch:

# Keep only the newest validation build; rapid commits should not queue duplicate SDK installs.
concurrency:
  group: amz-launcher-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolated-gradle-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AMZ and pinned LeviLauncher source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install pinned Android SDK, NDK and CMake
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Create isolated build copy and disable private Discord integration
        shell: bash
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/AMZ_LAUNCHER_PORT/LeviLaunchroid"
          dst="$RUNNER_TEMP/AMZ-LeviLauncher-validation"
          test -f "$src/gradlew"
          test -f "$src/app/build.gradle"
          cp -a "$src" "$dst"
          export AMZ_VALIDATION_DIR="$dst"
          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["AMZ_VALIDATION_DIR"])
          gradle_file = root / "app/build.gradle"
          source = gradle_file.read_text()

          for line in (
              "    alias(libs.plugins.google.services)\n",
              "    alias(libs.plugins.firebase.crashlytics)\n",
              "    implementation files('libs/discord_partner_sdk.aar')\n",
          ):
              if line not in source:
                  raise SystemExit(f"Expected upstream integration line not found: {line.strip()}")
              source = source.replace(line, "")

          marker = "firebaseCrashlytics {"
          while marker in source:
              start = source.index(marker)
              brace = source.index("{", start)
              depth = 0
              end = None
              for i in range(brace, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit("Unbalanced firebaseCrashlytics block")
              line_start = source.rfind("\n", 0, start) + 1
              line_end = source.find("\n", end)
              if line_end == -1:
                  line_end = end
              else:
                  line_end += 1
              source = source[:line_start] + source[line_end:]

          gradle_file.write_text(source)

          discord_dir = root / "app/src/main/java/org/levimc/launcher/core/discord"
          (discord_dir / "DiscordPresence.java").unlink()
          (discord_dir / "DiscordPresence.java").write_text("""package org.levimc.launcher.core.discord;

          import android.app.Application;

          /** AMZ validation-only stub. Discord presence is intentionally disabled. */
          public final class DiscordPresence {
              private DiscordPresence() {}
              public static void initialize(Application application) {}
              public static boolean isConfigured() { return false; }
              public static void refresh() {}
              public static void shutdown() {}
          }
          """)

          patched = gradle_file.read_text()
          for forbidden in ("discord_partner_sdk.aar", "libs.plugins.google.services", "libs.plugins.firebase.crashlytics", marker):
              if forbidden in patched:
                  raise SystemExit(f"Disabled integration remains: {forbidden}")
          print("Isolated copy prepared; upstream source and AMZ application files were not modified.")
          PY
          # Stage the AMZ floating overlay into the isolated launcher build.
          overlay_src="$GITHUB_WORKSPACE/AMZ_LAUNCHER_PORT/AMZ_OVERLAY/src/main/java/com/amz/client/AMZOverlayService.java"
          test -f "$overlay_src"
          mkdir -p "$dst/app/src/main/java/com/amz/client"
          cp "$overlay_src" "$dst/app/src/main/java/com/amz/client/AMZOverlayService.java"
          python3 - "$dst/app/src/main/AndroidManifest.xml" <<'PY'
          import sys
          from pathlib import Path
          manifest = Path(sys.argv[1])
          xml = manifest.read_text()

          # The upstream manifest deliberately removes generic foreground-service
          # permissions. Re-enable the narrowly scoped specialUse type for AMZ.
          xml = xml.replace(
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" tools:node="remove" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />')
          xml = xml.replace(
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" tools:node="remove" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />')

          service = """        <service
                      android:name="com.amz.client.AMZOverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating game controls shown while the user plays Minecraft" />
                  </service>
          """
          if 'com.amz.client.AMZOverlayService' not in xml:
              marker = '    </application>'
              if marker not in xml:
                  raise SystemExit("Application closing tag not found")
              xml = xml.replace(marker, service + marker, 1)

          for required in (
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
              'android.permission.SYSTEM_ALERT_WINDOW',
              'android.permission.PACKAGE_USAGE_STATS',
              'android.permission.POST_NOTIFICATIONS',
          ):
              if f'android:name="{required}"' not in xml:
                  application = xml.index('<application')
                  xml = xml[:application] + f'    <uses-permission android:name="{required}" />' + chr(10) + xml[application:]

          manifest.write_text(xml)
          PY
          chmod +x "$dst/gradlew"
          echo "AMZ_VALIDATION_DIR=$dst" >> "$GITHUB_ENV"

      - name: Build isolated upstream launcher APK
        working-directory: ${{ runner.temp }}/AMZ-LeviLauncher-validation
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload isolated validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-LeviLauncher-Isolated-Validation
          path: ${{ runner.temp }}/AMZ-LeviLauncher-validation/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
