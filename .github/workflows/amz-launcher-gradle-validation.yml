name: AMZ Isolated Launcher Gradle Build

on:
  push:
    branches:
      - amz-launcher-integration
    paths:
      - ".github/workflows/amz-launcher-gradle-validation.yml"
      - "AMZ_LAUNCHER_PORT/**"
  workflow_dispatch:

# Keep only the newest validation build; rapid commits should not queue duplicate SDK installs.
concurrency:
  group: amz-launcher-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolated-gradle-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout AMZ and pinned LeviLauncher source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install pinned Android SDK, NDK and CMake
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build bundled AMZ ARM64 native mod
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cmake -S AMZ_NATIVE_MOD -B AMZ_NATIVE_MOD/build-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared
          cmake --build AMZ_NATIVE_MOD/build-arm64 --target levi_package --parallel 2
          test -s AMZ_NATIVE_MOD/build-arm64/AMZ_NATIVE-arm64-v8a.levipack

      - name: Create isolated build copy and disable private Discord integration
        shell: bash
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/AMZ_LAUNCHER_PORT/LeviLaunchroid"
          dst="$RUNNER_TEMP/AMZ-LeviLauncher-validation"
          test -f "$src/gradlew"
          test -f "$src/app/build.gradle"
          cp -a "$src" "$dst"
          export AMZ_VALIDATION_DIR="$dst"
          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["AMZ_VALIDATION_DIR"])
          gradle_file = root / "app/build.gradle"
          source = gradle_file.read_text()

          for line in (
              "    alias(libs.plugins.google.services)\n",
              "    alias(libs.plugins.firebase.crashlytics)\n",
              "    implementation files('libs/discord_partner_sdk.aar')\n",
          ):
              if line not in source:
                  raise SystemExit(f"Expected upstream integration line not found: {line.strip()}")
              source = source.replace(line, "")

          marker = "firebaseCrashlytics {"
          while marker in source:
              start = source.index(marker)
              brace = source.index("{", start)
              depth = 0
              end = None
              for i in range(brace, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit("Unbalanced firebaseCrashlytics block")
              line_start = source.rfind("\n", 0, start) + 1
              line_end = source.find("\n", end)
              if line_end == -1:
                  line_end = end
              else:
                  line_end += 1
              source = source[:line_start] + source[line_end:]

          gradle_file.write_text(source)

          discord_dir = root / "app/src/main/java/org/levimc/launcher/core/discord"
          (discord_dir / "DiscordPresence.java").unlink()
          (discord_dir / "DiscordPresence.java").write_text("""package org.levimc.launcher.core.discord;

          import android.app.Application;

          /** AMZ validation-only stub. Discord presence is intentionally disabled. */
          public final class DiscordPresence {
              private DiscordPresence() {}
              public static void initialize(Application application) {}
              public static boolean isConfigured() { return false; }
              public static void refresh() {}
              public static void shutdown() {}
          }
          """)

          patched = gradle_file.read_text()
          for forbidden in ("discord_partner_sdk.aar", "libs.plugins.google.services", "libs.plugins.firebase.crashlytics", marker):
              if forbidden in patched:
                  raise SystemExit(f"Disabled integration remains: {forbidden}")
          print("Isolated copy prepared; upstream source and AMZ application files were not modified.")
          PY
          # Stage the AMZ floating overlay into the isolated launcher build.
          overlay_src="$GITHUB_WORKSPACE/AMZ_LAUNCHER_PORT/AMZ_OVERLAY/src/main/java/com/amz/client/AMZOverlayService.java"
          test -f "$overlay_src"
          mkdir -p "$dst/app/src/main/java/com/amz/client"
          cp "$overlay_src" "$dst/app/src/main/java/com/amz/client/AMZOverlayService.java"
          permission_src="$GITHUB_WORKSPACE/AMZ_LAUNCHER_PORT/AMZ_OVERLAY/src/main/java/com/amz/client/AMZOverlayPermissionManager.java"
          test -f "$permission_src"
          cp "$permission_src" "$dst/app/src/main/java/com/amz/client/AMZOverlayPermissionManager.java"
          native_installer_src="$GITHUB_WORKSPACE/AMZ_LAUNCHER_PORT/AMZ_OVERLAY/src/main/java/com/amz/client/AMZNativePackInstaller.java"
          test -f "$native_installer_src"
          cp "$native_installer_src" "$dst/app/src/main/java/com/amz/client/AMZNativePackInstaller.java"
          mkdir -p "$dst/app/src/main/assets"
          cp "$GITHUB_WORKSPACE/AMZ_NATIVE_MOD/build-arm64/AMZ_NATIVE-arm64-v8a.levipack" "$dst/app/src/main/assets/amz_native.levipack"
          python3 - "$dst/app/src/main/AndroidManifest.xml" "$dst/app/src/main/java/org/levimc/launcher/ui/activities/MainActivity.java" "$dst/app/src/main/java/org/levimc/launcher/core/minecraft/MinecraftLoadingActivity.kt" "$dst/app/src/main/java/org/levimc/launcher/core/minecraft/MinecraftRuntimePreparer.kt" <<'PY'
          import sys
          from pathlib import Path
          manifest = Path(sys.argv[1])
          xml = manifest.read_text()

          # The upstream manifest deliberately removes generic foreground-service
          # permissions. Re-enable the narrowly scoped specialUse type for AMZ.
          xml = xml.replace(
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" tools:node="remove" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />')
          xml = xml.replace(
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" tools:node="remove" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />')

          service = """        <service
                      android:name="com.amz.client.AMZOverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating game controls shown while the user plays Minecraft" />
                  </service>
          """
          if 'com.amz.client.AMZOverlayService' not in xml:
              marker = '    </application>'
              if marker not in xml:
                  raise SystemExit("Application closing tag not found")
              xml = xml.replace(marker, service + marker, 1)

          for required in (
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
              'android.permission.SYSTEM_ALERT_WINDOW',
              'android.permission.PACKAGE_USAGE_STATS',
              'android.permission.POST_NOTIFICATIONS',
          ):
              if f'android:name="{required}"' not in xml:
                  application = xml.index('<application')
                  xml = xml[:application] + f'    <uses-permission android:name="{required}" />' + chr(10) + xml[application:]

          manifest.write_text(xml)

          # Add opt-in permission onboarding to the upstream launcher home screen.
          main_activity = Path(sys.argv[2])
          main_source = main_activity.read_text()
          import_line = "import com.amz.client.AMZOverlayPermissionManager;"
          if import_line not in main_source:
              package_line = "package org.levimc.launcher.ui.activities;\n"
              if package_line not in main_source:
                  raise SystemExit("MainActivity package declaration not found")
              main_source = main_source.replace(package_line, package_line + "\n" + import_line + "\n", 1)
          resume_marker = "        if (!launcherInitialized) {\n            showPostEulaFlow();\n            return;\n        }\n"
          if resume_marker not in main_source:
              raise SystemExit("MainActivity onResume insertion point not found")
          main_source = main_source.replace(
              resume_marker,
              resume_marker + "        AMZOverlayPermissionManager.maybePrompt(this);\n",
              1)
          main_activity.write_text(main_source)

          # Start the optional overlay only after runtime preparation succeeds and
          # immediately before Minecraft receives foreground.
          runtime_preparer = Path(sys.argv[4])
          runtime_source = runtime_preparer.read_text()
          runtime_import = "import com.amz.client.AMZNativePackInstaller"
          if runtime_import not in runtime_source:
              package_line = "package org.levimc.launcher.core.minecraft\n"
              if package_line not in runtime_source:
                  raise SystemExit("MinecraftRuntimePreparer package declaration not found")
              runtime_source = runtime_source.replace(package_line, package_line + "\n" + runtime_import + "\n", 1)
          runtime_marker = "        modManager.setCurrentVersion(version)\n"
          if runtime_marker not in runtime_source:
              raise SystemExit("Native mod installation insertion point not found")
          runtime_source = runtime_source.replace(
              runtime_marker,
              runtime_marker + "        val amzPackInstalled = AMZNativePackInstaller.install(context, modManager.currentVersion?.modsDir)\n        listener.onLog(if (amzPackInstalled) \"AMZ native pack installed\" else \"AMZ native pack install skipped or failed\")\n        if (amzPackInstalled) {\n            modManager.reloadMods()\n            listener.onLog(\"AMZ native pack registered for this launch\")\n        }\n",
              1)
          runtime_preparer.write_text(runtime_source)

          loading_activity = Path(sys.argv[3])
          loading_source = loading_activity.read_text()
          kotlin_import = "import com.amz.client.AMZOverlayPermissionManager"
          if kotlin_import not in loading_source:
              package_line = "package org.levimc.launcher.core.minecraft\n"
              if package_line not in loading_source:
                  raise SystemExit("MinecraftLoadingActivity package declaration not found")
              loading_source = loading_source.replace(package_line, package_line + "\n" + kotlin_import + "\n", 1)
          transition_marker = "        if (returningToLauncher || isFinishing || isDestroyed) return\n        startActivity(gameIntent)"
          transition_replacement = "        if (returningToLauncher || isFinishing || isDestroyed) return\n        AMZOverlayPermissionManager.startOverlayIfAllowed(this)\n        startActivity(gameIntent)"
          if transition_marker not in loading_source:
              raise SystemExit("Minecraft transition insertion point not found")
          loading_source = loading_source.replace(transition_marker, transition_replacement, 1)
          loading_activity.write_text(loading_source)
          PY
          chmod +x "$dst/gradlew"
          echo "AMZ_VALIDATION_DIR=$dst" >> "$GITHUB_ENV"

      - name: Build isolated upstream launcher APK
        working-directory: ${{ runner.temp }}/AMZ-LeviLauncher-validation
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload isolated validation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-LeviLauncher-Isolated-Validation
          path: ${{ runner.temp }}/AMZ-LeviLauncher-validation/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
