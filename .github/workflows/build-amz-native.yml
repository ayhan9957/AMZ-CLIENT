name: Build AMZ Native Module

on:
  workflow_dispatch:
  push:
    paths:
      - "AMZ_NATIVE_MOD/**"
      - ".github/workflows/build-amz-native.yml"
    branches: [main]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK and CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Set Android NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure ARM64 native mod
        working-directory: AMZ_NATIVE_MOD
        run: |
          cmake -S . -B build-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared
      - name: Build .so and .levipack
        working-directory: AMZ_NATIVE_MOD
        run: cmake --build build-arm64 --target levi_package --parallel 2
      - name: Upload native module
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-NATIVE-arm64
          path: |
            AMZ_NATIVE_MOD/build-arm64/AMZ_NATIVE-arm64-v8a.levipack
            AMZ_NATIVE_MOD/build-arm64/package/amz_native/libamz_native.so
          if-no-files-found: error
