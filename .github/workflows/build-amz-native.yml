name: Build AMZ Native Module

on:
  workflow_dispatch:
  push:
    paths:
      - "AMZ_NATIVE_MOD/**"
      - ".github/workflows/build-amz-native.yml"
    branches: [amz-launcher-integration]

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: amz-launcher-integration
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Set Android NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure armeabi-v7a native mod
        working-directory: AMZ_NATIVE_MOD
        run: |
          cmake -S . -B build-armv7 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared
      - name: Build .so and .levipack
        working-directory: AMZ_NATIVE_MOD
        run: cmake --build build-armv7 --target levi_package --parallel 2
      - name: Upload native module
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-NATIVE-armeabi-v7a
          path: |
            AMZ_NATIVE_MOD/build-armv7/AMZ_NATIVE-armeabi-v7a.levipack
            AMZ_NATIVE_MOD/build-armv7/package/amz_native/libamz_native.so
          if-no-files-found: error
