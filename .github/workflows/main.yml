name: Build AMZ Client APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Extract project
        run: |
          unzip -o AMZ_CLIENT_APK_Project.zip -d project

      - name: Inspect extracted AMZ Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = list(Path("project").glob("**/settings.gradle"))
          if not roots:
              raise SystemExit("No settings.gradle found")
          root = roots[0].parent
          print("=== PROJECT ROOT ===")
          print(root)
          print("=== PROJECT FILE TREE ===")
          for p in sorted(root.rglob("*")):
              if p.is_file() and (p.suffix in {".java", ".kt", ".gradle", ".xml", ".properties"} or p.name in {"gradle.properties", "settings.gradle"}):
                  print(p.relative_to(root))
          selected = []
          for p in sorted(root.rglob("*")):
              if not p.is_file():
                  continue
              rel = p.relative_to(root).as_posix()
              if p.name in {"settings.gradle", "build.gradle", "gradle.properties", "AndroidManifest.xml"} or (p.suffix in {".java", ".kt"} and "/src/main/" in "/" + rel):
                  selected.append(p)
          print("=== SOURCE CONTENTS ===")
          budget = 120000
          for p in selected:
              data = p.read_text(encoding="utf-8", errors="replace")
              if len(data) > 18000:
                  data = data[:18000] + "\\n...[TRUNCATED]..."
              if len(data) > budget:
                  print("SOURCE BUDGET REACHED")
                  break
              print(f"\\n===== FILE: {p.relative_to(root)} =====\\n{data}")
              budget -= len(data)
          PY

      - name: Apply AMZ launcher icon and overlay permission
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "App manifest not found: $MANIFEST"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/amz_eye.png" ]; then
            echo "amz_eye.png not found in repository root"
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"
          cp "$GITHUB_WORKSPACE/amz_eye.png" "$PROJECT_DIR/app/src/main/res/drawable/amz_eye.png"
          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          if app is None:
              raise SystemExit('Manifest has no application element')
          app.set(android + 'icon', '@drawable/amz_eye')
          perm_name = '{http://schemas.android.com/apk/res/android}name'
          for permission in ('android.permission.SYSTEM_ALERT_WINDOW', 'android.permission.PACKAGE_USAGE_STATS', 'android.permission.FOREGROUND_SERVICE'):
              if not any(p.get(perm_name) == permission for p in root.findall('uses-permission')):
                  p = ET.Element('uses-permission')
                  p.set(perm_name, permission)
                  root.insert(0, p)
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

      - name: Use current AMZ launcher screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root_activity = Path("MainActivity.java")
          if not root_activity.is_file():
              raise SystemExit("Root MainActivity.java is missing")
          candidates = list(Path("project").glob("**/app/src/main/java/**/MainActivity.java"))
          if not candidates:
              raise SystemExit("Extracted MainActivity.java not found")
          target = candidates[0]
          shutil.copyfile(root_activity, target)
          print(f"Using current AMZ launcher screen: {target}")
          PY

      - name: Add automatic AMZ floating overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          candidates = list(Path("project").glob("**/app/src/main/java/**/MainActivity.java"))
          if not candidates:
              raise SystemExit("MainActivity.java not found")
          activity = candidates[0]
          package_dir = activity.parent
          service = package_dir / "AMZOverlayService.java"
          service_source = Path("AMZ_OVERLAY/src/main/java/com/amz/client/AMZOverlayService.java")
          if not service_source.is_file():
              raise SystemExit(f"Overlay source missing: {service_source}")
          service.write_text(service_source.read_text(encoding="utf-8"), encoding="utf-8")

          manifest = activity.parents[4] / "AndroidManifest.xml"
          if not manifest.exists():
              manifests = list(Path("project").glob("**/app/src/main/AndroidManifest.xml"))
              if not manifests:
                  raise SystemExit("AndroidManifest.xml not found")
              manifest = manifests[0]
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("Manifest application element missing")
          if not any(x.get(ns+"name") == ".AMZOverlayService" for x in app.findall("service")):
              svc = ET.SubElement(app, "service")
              svc.set(ns+"name", ".AMZOverlayService")
              svc.set(ns+"exported", "false")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("AMZ floating overlay service and manifest entry added")
          PY

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          gradle assembleDebug --stacktrace --info --console=plain 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-BUILD-LOG
          path: project/**/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-CLIENT-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
