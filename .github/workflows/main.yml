name: Build AMZ Client APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Extract project
        run: |
          unzip -o AMZ_CLIENT_APK_Project.zip -d project

      - name: Apply AMZ launcher icon and overlay permission
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "App manifest not found: $MANIFEST"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/amz_eye.png" ]; then
            echo "amz_eye.png not found in repository root"
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"
          cp "$GITHUB_WORKSPACE/amz_eye.png" "$PROJECT_DIR/app/src/main/res/drawable/amz_eye.png"
          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          if app is None:
              raise SystemExit('Manifest has no application element')
          app.set(android + 'icon', '@drawable/amz_eye')
          perm_name = '{http://schemas.android.com/apk/res/android}name'
          for permission in ('android.permission.SYSTEM_ALERT_WINDOW', 'android.permission.PACKAGE_USAGE_STATS'):
              if not any(p.get(perm_name) == permission for p in root.findall('uses-permission')):
                  p = ET.Element('uses-permission')
                  p.set(perm_name, permission)
                  root.insert(0, p)
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

      - name: Use current AMZ launcher screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root_activity = Path("MainActivity.java")
          if not root_activity.is_file():
              raise SystemExit("Root MainActivity.java is missing")
          candidates = list(Path("project").glob("**/app/src/main/java/**/MainActivity.java"))
          if not candidates:
              raise SystemExit("Extracted MainActivity.java not found")
          target = candidates[0]
          shutil.copyfile(root_activity, target)
          print(f"Using current AMZ launcher screen: {target}")
          PY

      - name: Add automatic AMZ floating overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          candidates = list(Path("project").glob("**/app/src/main/java/**/MainActivity.java"))
          if not candidates:
              raise SystemExit("MainActivity.java not found")
          activity = candidates[0]
          package_dir = activity.parent
          service = package_dir / "AMZOverlayService.java"
          service.write_text(r'''
          package com.amz.client;
          
          import android.app.Service;
          import android.content.Intent;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.widget.Toast;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.IBinder;
          import android.os.Handler;
          import android.os.Looper;
          import android.app.usage.UsageEvents;
          import android.app.usage.UsageStatsManager;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          
          public class AMZOverlayService extends Service {
              private WindowManager wm;
              private WindowManager.LayoutParams bubbleParams;
              private View bubble, panel;
              private LinearLayout moduleList, tabList;
              private final Handler monitorHandler = new Handler(Looper.getMainLooper());
              private final long serviceStartedAt = System.currentTimeMillis();
              private final Runnable foregroundMonitor = new Runnable() {
                  @Override public void run() {
                      try {
                          UsageStatsManager usage = (UsageStatsManager)getSystemService(USAGE_STATS_SERVICE);
                          long now = System.currentTimeMillis();
                          UsageEvents events = usage.queryEvents(now - 30000L, now);
                          UsageEvents.Event event = new UsageEvents.Event();
                          String latestForeground = null;
                          while (events != null && events.hasNextEvent()) {
                              events.getNextEvent(event);
                              int type = event.getEventType();
                              if (type == UsageEvents.Event.MOVE_TO_FOREGROUND ||
                                  (android.os.Build.VERSION.SDK_INT >= 29 &&
                                   type == UsageEvents.Event.ACTIVITY_RESUMED)) {
                                  latestForeground = event.getPackageName();
                              }
                          }
                          boolean minecraftForeground =
                              "com.mojang.minecraftpe".equals(latestForeground) ||
                              "com.mojang.minecraftpf".equals(latestForeground);
                          // Allow Minecraft time to finish opening before checking the foreground app.
                          if (!minecraftForeground && now - serviceStartedAt > 12000L) {
                              stopSelf();
                              return;
                          }
                      } catch (Exception ignored) {
                          // Keep the overlay alive if Android temporarily withholds usage events.
                      }
                      monitorHandler.postDelayed(this, 1000L);
                  }
              };
              private String activeCategory = "CAM";
              private final String[] categories = {"CAM","FLY","ATTACK","AIM","ESP","BLOCK","XRAY","HITBOX","C-F"};
              private final String[][] modules = {
                  {"FreeCam","Camera controls • Demo"},{"ViewLock","View lock • Demo"},{"WireLock","Wire view • Demo"},
                  {"Gravity","Gravity control • Demo"},{"Speed","Movement speed • Demo"},
                  {"AutoClick","Tap automation • Demo"},{"KillAura","Players + mobs • In-game command"},
                  {"Target","Target selector • Demo"},{"Aimbot","Aim helper • Demo"},
                  {"Player ESP","Player overlay • Demo"},{"ESP-Chest","Chest highlight • Demo"},
                  {"Scaffold","Block placement • Demo"},
                  {"Xray","Block visibility • Demo"},{"Xray-Ore","Ore highlight • Demo"},
                  {"Hitbox","Hitbox display • Demo"},{"Rainbow Hitbox","Animated hitbox • Demo"},
                  {"FPS","Frame counter • Demo"},{"CPS","Click counter • Demo"},{"FPS Boost","Performance preset • Demo"}
              };
              private final String[] moduleCategories = {
                  "CAM","CAM","CAM","FLY","FLY","ATTACK","ATTACK","AIM","AIM",
                  "ESP","ESP","BLOCK","XRAY","XRAY","HITBOX","HITBOX","C-F","C-F","C-F"
              };
          
              private int dp(float n) { return (int)(n * getResources().getDisplayMetrics().density + .5f); }
              private GradientDrawable bg(int color, int radius, int stroke) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(color); d.setCornerRadius(dp(radius));
                  if (stroke != 0) d.setStroke(dp(1), stroke);
                  return d;
              }
              private TextView label(String value, int size, int color) {
                  TextView t = new TextView(this); t.setText(value); t.setTextSize(size);
                  t.setTextColor(color); t.setGravity(Gravity.CENTER_VERTICAL);
                  return t;
              }
              private LinearLayout.LayoutParams lp(int w, int h) { return new LinearLayout.LayoutParams(w < 0 ? w : dp(w), h < 0 ? h : dp(h)); }
          
              @Override public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager)getSystemService(WINDOW_SERVICE);
                  monitorHandler.postDelayed(foregroundMonitor, 12000L);
                  ImageView b = new ImageView(this);
                  int logoId = getResources().getIdentifier("amz_eye", "drawable", getPackageName());
                  if (logoId != 0) b.setImageResource(logoId);
                  b.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                  b.setPadding(dp(5), dp(5), dp(5), dp(5));
                  b.setBackground(bg(Color.rgb(13,9,25), 40, Color.rgb(190,105,255)));
                  b.setElevation(dp(12)); bubble = b;
                  bubbleParams = new WindowManager.LayoutParams(dp(58), dp(58),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT);
                  bubbleParams.gravity = Gravity.TOP | Gravity.END; bubbleParams.x = dp(14); bubbleParams.y = dp(145);
                  bubble.setOnTouchListener(new View.OnTouchListener() {
                      float x,y; int sx,sy; boolean moved;
                      public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction()==MotionEvent.ACTION_DOWN) { x=e.getRawX(); y=e.getRawY(); sx=bubbleParams.x; sy=bubbleParams.y; moved=false; return true; }
                          if (e.getAction()==MotionEvent.ACTION_MOVE) {
                              float dx=e.getRawX()-x, dy=e.getRawY()-y;
                              if (Math.abs(dx)>dp(5)||Math.abs(dy)>dp(5)) moved=true;
                              bubbleParams.x=sx-(int)dx; bubbleParams.y=sy+(int)dy;
                              try { wm.updateViewLayout(bubble,bubbleParams); } catch(Exception ignored) {}
                              return true;
                          }
                          if (e.getAction()==MotionEvent.ACTION_UP) { if(!moved) openOrClose(); return true; }
                          return true;
                      }
                  });
                  wm.addView(bubble,bubbleParams);
              }
          
              private void openOrClose() {
                  if (panel != null) { closePanel(); return; }
                  LinearLayout shell = new LinearLayout(this);
                  shell.setOrientation(LinearLayout.VERTICAL);
                  shell.setPadding(dp(14),dp(13),dp(14),dp(12));
                  shell.setBackground(bg(Color.rgb(15,14,25),22,Color.rgb(112,67,155)));
                  shell.setElevation(dp(18));
          
                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  TextView logo = label("AMZ",22,Color.WHITE);
                  logo.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  top.addView(logo,lp(62,38));
                  LinearLayout titleBox = new LinearLayout(this);
                  titleBox.setOrientation(LinearLayout.VERTICAL);
                  TextView title = label("AMZ CLIENT",14,Color.WHITE); title.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  TextView version = label("BEDROCK  •  1.21.93",9,Color.rgb(169,151,190));
                  titleBox.addView(title); titleBox.addView(version);
                  top.addView(titleBox,new LinearLayout.LayoutParams(0,dp(42),1));
                  TextView close = label("×",27,Color.rgb(210,195,225)); close.setGravity(Gravity.CENTER);
                  top.addView(close,lp(34,38)); close.setOnClickListener(v->closePanel());
                  shell.addView(top);
          
                  LinearLayout status = new LinearLayout(this);
                  status.setGravity(Gravity.CENTER_VERTICAL); status.setPadding(dp(10),0,dp(10),0);
                  status.setBackground(bg(Color.rgb(31,25,43),10,Color.rgb(65,48,83)));
                  TextView dot = label("●",10,Color.rgb(120,235,170)); status.addView(dot,lp(18,32));
                  TextView state = label("CLIENT MENU",10,Color.rgb(204,188,220));
                  state.setTypeface(Typeface.DEFAULT,Typeface.BOLD); status.addView(state,new LinearLayout.LayoutParams(0,dp(32),1));
                  TextView count = label("MODULES",9,Color.rgb(175,145,205)); status.addView(count);
                  LinearLayout.LayoutParams sp=lp(-1,32); sp.topMargin=dp(8); shell.addView(status,sp);
          
                  HorizontalScrollView tabsScroll = new HorizontalScrollView(this);
                  tabsScroll.setHorizontalScrollBarEnabled(false);
                  tabList = new LinearLayout(this); tabList.setOrientation(LinearLayout.HORIZONTAL);
                  tabsScroll.addView(tabList); LinearLayout.LayoutParams tp=lp(-1,42); tp.topMargin=dp(9); shell.addView(tabsScroll,tp);
                  buildTabs();
          
                  ScrollView sc = new ScrollView(this); sc.setFillViewport(false);
                  moduleList = new LinearLayout(this); moduleList.setOrientation(LinearLayout.VERTICAL);
                  sc.addView(moduleList);
                  LinearLayout.LayoutParams mp=lp(-1,300); mp.topMargin=dp(5); shell.addView(sc,mp);
                  buildModules();
          
                  TextView footer = label("AMZ  /  VISUAL MENU PREVIEW",9,Color.rgb(118,105,137));
                  footer.setGravity(Gravity.CENTER); LinearLayout.LayoutParams fp=lp(-1,25); fp.topMargin=dp(5); shell.addView(footer,fp);
          
                  WindowManager.LayoutParams p = new WindowManager.LayoutParams(
                      Math.min(dp(320),getResources().getDisplayMetrics().widthPixels-dp(24)),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT);
                  p.gravity=Gravity.TOP|Gravity.END; p.x=dp(10); p.y=dp(210);
                  panel=shell; wm.addView(panel,p);
                  panel.setAlpha(0f); panel.setScaleX(.94f); panel.setScaleY(.94f);
                  panel.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(190).start();
              }
          
              private void buildTabs() {
                  tabList.removeAllViews();
                  for (String category : categories) {
                      boolean selected = category.equals(activeCategory);
                      TextView tab = label(category,10,selected?Color.WHITE:Color.rgb(160,146,177));
                      tab.setGravity(Gravity.CENTER); tab.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                      tab.setPadding(dp(12),0,dp(12),0);
                      tab.setBackground(bg(selected?Color.rgb(91,48,125):Color.rgb(28,25,38),9,selected?Color.rgb(190,105,255):Color.rgb(47,40,58)));
                      LinearLayout.LayoutParams p=lp(-2,32); p.setMargins(0,dp(3),dp(6),dp(3)); tabList.addView(tab,p);
                      tab.setOnClickListener(v->{activeCategory=category;buildTabs();buildModules();});
                  }
              }
          
              private void buildModules() {
                  moduleList.removeAllViews();
                  for (int i=0;i<modules.length;i++) {
                      if (!moduleCategories[i].equals(activeCategory)) continue;
                      final String name=modules[i][0];
                      LinearLayout row=new LinearLayout(this); row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(dp(9),dp(5),dp(9),dp(5));
                      row.setBackground(bg(Color.rgb(26,23,36),12,Color.rgb(48,40,59)));
                      LinearLayout icon=new LinearLayout(this); icon.setGravity(Gravity.CENTER);
                      TextView symbol=label("✦",15,Color.rgb(206,151,255)); symbol.setGravity(Gravity.CENTER); icon.addView(symbol);
                      icon.setBackground(bg(Color.rgb(54,36,72),10,0)); row.addView(icon,lp(34,34));
                      LinearLayout words=new LinearLayout(this); words.setOrientation(LinearLayout.VERTICAL);
                      TextView n=label(name,12,Color.rgb(245,240,250)); n.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                      TextView desc=label(modules[i][1],9,Color.rgb(143,132,158));
                      words.addView(n); words.addView(desc);
                      LinearLayout.LayoutParams wp=new LinearLayout.LayoutParams(0,dp(42),1); wp.leftMargin=dp(9); row.addView(words,wp);
                      TextView toggle=label("OFF",9,Color.rgb(169,156,184)); toggle.setGravity(Gravity.CENTER);
                      toggle.setTypeface(Typeface.DEFAULT,Typeface.BOLD); toggle.setBackground(bg(Color.rgb(43,38,51),8,Color.rgb(67,57,78)));
                      row.addView(toggle,lp(48,27));
                      toggle.setOnClickListener(v->{
                          boolean enabled=Boolean.TRUE.equals(toggle.getTag());
                          toggle.setTag(!enabled); toggle.setText(enabled?"OFF":"ON");
                          toggle.setTextColor(enabled?Color.rgb(169,156,184):Color.WHITE);
                          toggle.setBackground(bg(enabled?Color.rgb(43,38,51):Color.rgb(117,62,78),8,enabled?Color.rgb(67,57,78):Color.rgb(205,139,255)));
                          if ("KillAura".equals(name)) {
                              String command = enabled ? "/tag @s remove amz_killaura" : "/tag @s add amz_killaura";
                              ClipboardManager clipboard = (ClipboardManager)getSystemService(Context.CLIPBOARD_SERVICE);
                              clipboard.setPrimaryClip(ClipData.newPlainText("AMZ KillAura", command));
                              Toast.makeText(this, "Komut kopyalandi: Minecraft sohbetine yapistirip gonder", Toast.LENGTH_LONG).show();
                          }
                      });
                      LinearLayout.LayoutParams rp=lp(-1,58); rp.setMargins(0,dp(3),0,dp(3)); moduleList.addView(row,rp);
                  }
              }
          
              private void closePanel() {
                  if(panel==null)return;
                  View old=panel; panel=null;
                  old.animate().alpha(0f).scaleX(.94f).scaleY(.94f).setDuration(130)
                      .withEndAction(()->{try{wm.removeView(old);}catch(Exception ignored){}}).start();
              }
              @Override public void onDestroy() {
                  monitorHandler.removeCallbacks(foregroundMonitor);
                  if(panel!=null)try{wm.removeView(panel);}catch(Exception ignored){}
                  if(bubble!=null)try{wm.removeView(bubble);}catch(Exception ignored){}
                  super.onDestroy();
              }
              @Override public IBinder onBind(Intent intent){return null;}
          }
          ''', encoding="utf-8")
          manifest = activity.parents[4] / "AndroidManifest.xml"
          if not manifest.exists():
              manifests = list(Path("project").glob("**/app/src/main/AndroidManifest.xml"))
              if not manifests:
                  raise SystemExit("AndroidManifest.xml not found")
              manifest = manifests[0]
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("Manifest application element missing")
          if not any(x.get(ns+"name") == ".AMZOverlayService" for x in app.findall("service")):
              svc = ET.SubElement(app, "service")
              svc.set(ns+"name", ".AMZOverlayService")
              svc.set(ns+"exported", "false")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("AMZ floating overlay service and manifest entry added")
          PY

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          gradle assembleDebug --stacktrace --info --console=plain 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-BUILD-LOG
          path: project/**/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-CLIENT-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
