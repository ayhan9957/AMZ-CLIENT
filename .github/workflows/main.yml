
name: Build AMZ Client APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q AMZ_CLIENT_APK_Project.zip -d project
          WRAPPER=$(find project -name gradlew -type f | head -n 1)
          test -n "$WRAPPER"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AMZ-CLIENT-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
