
name: Build AMZ Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check and extract ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          import os
          import sys

          archive = "AMZ_CLIENT_APK_Project.zip"

          if not os.path.isfile(archive):
              print("ERROR: ZIP file not found!")
              sys.exit(1)

          with zipfile.ZipFile(archive) as z:
              print("ZIP FILE CONTENTS:")
              for name in z.namelist()[:100]:
                  print(name)

              bad = z.testzip()
              if bad:
                  print("BROKEN FILE:", bad)
                  sys.exit(1)

              z.extractall("project")

          print("ZIP extraction successful!")
          PY

      - name: Find Gradle project
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found!"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-CLIENT-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
