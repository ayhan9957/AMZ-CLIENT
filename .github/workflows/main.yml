name: Build AMZ Client APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Extract project
        run: |
          unzip -o AMZ_CLIENT_APK_Project.zip -d project

      - name: Apply AMZ launcher icon and overlay permission
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "App manifest not found: $MANIFEST"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/amz_eye.png" ]; then
            echo "amz_eye.png not found in repository root"
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable"
          cp "$GITHUB_WORKSPACE/amz_eye.png" "$PROJECT_DIR/app/src/main/res/drawable/amz_eye.png"
          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          if app is None:
              raise SystemExit('Manifest has no application element')
          app.set(android + 'icon', '@drawable/amz_eye')
          perm_name = '{http://schemas.android.com/apk/res/android}name'
          if not any(p.get(perm_name) == 'android.permission.SYSTEM_ALERT_WINDOW' for p in root.findall('uses-permission')):
              p = ET.Element('uses-permission')
              p.set(perm_name, 'android.permission.SYSTEM_ALERT_WINDOW')
              root.insert(0, p)
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

      - name: Launch original Minecraft PE or PF automatically
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(Path("project").glob("**/app/src/main/java/**/MainActivity.java"))
          if not files:
              raise SystemExit("MainActivity.java not found in extracted Android app")

          for path in files:
              source = path.read_text(encoding="utf-8")
              if "AMZ_SUPPORTED_MINECRAFT_PACKAGES" in source:
                  print(f"PE and PF launch support already present in {path}")
                  raise SystemExit(0)

              match = re.search(r"\\bonCreate\\s*\\([^)]*\\)\\s*\\{", source)
              if not match:
                  continue

              opening = source.find("{", match.start())
              depth = 0
              closing = None
              for i in range(opening, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          closing = i
                          break
              if closing is None:
                  continue

              launch_lines = [
                  "        // AMZ_SUPPORTED_MINECRAFT_PACKAGES",
                  "        String[] amzMinecraftPackages = {",
                  '            "com.mojang.minecraftpe",',
                  '            "com.mojang.minecraftpf"',
                  "        };",
                  "        boolean amzMinecraftStarted = false;",
                  "        for (String amzPackage : amzMinecraftPackages) {",
                  "            android.content.Intent amzMinecraftIntent =",
                  "                getPackageManager().getLaunchIntentForPackage(amzPackage);",
                  "            if (amzMinecraftIntent != null) {",
                  "                startActivity(amzMinecraftIntent);",
                  "                amzMinecraftStarted = true;",
                  "                break;",
                  "            }",
                  "        }",
                  "        if (!amzMinecraftStarted) {",
                  '            android.widget.Toast.makeText(this, "Minecraft PE veya PF yüklü değil", android.widget.Toast.LENGTH_LONG).show();',
                  "        }",
                  ""
              ]
              launch = "\\n".join(launch_lines)
              source = source[:closing] + launch + source[closing:]
              path.write_text(source, encoding="utf-8")
              print(f"Inserted PE and PF launch support into {path}")
              raise SystemExit(0)

          raise SystemExit("Could not find onCreate method in MainActivity.java")
          PY

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          gradle assembleDebug --stacktrace --info --console=plain 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-BUILD-LOG
          path: project/**/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMZ-CLIENT-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
